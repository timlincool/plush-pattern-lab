name: Temporary owner-only design migration gate
on:
  push:
    branches: [work/unify-public-design-reference-20261026]
permissions:
  contents: read
jobs:
  design-reference:
    if: github.event_name == 'push' && github.ref == 'refs/heads/work/unify-public-design-reference-20261026'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install trusted wheel-only dependencies
        run: 'python -m pip install --only-binary=:all: -r requirements-dev.txt'
      - name: Install main-owned package
        run: python -m pip install --no-deps --no-build-isolation -e .
      - name: Verify release-facing tree, quality and data references
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/design-migration-probe.yml
          python scripts/check_quality.py
          python -m compileall -q src scripts tests
          python -m pytest -q
          python -m pip wheel --no-deps --no-build-isolation --wheel-dir "$RUNNER_TEMP/wheel" .
