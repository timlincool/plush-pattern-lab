name: Temporary owner-only seam-interface validation
on:
  push:
    branches: [work/stage6-hoof-interface-audit-20261028]
    paths:
      - '.github/workflows/temporary-owner-seam-check.yml'
      - 'src/plush_pattern_lab/validation/boundary_match.py'
      - 'src/plush_pattern_lab/blender/audit_hoof_interfaces.py'
      - 'scripts/audit_hoof_interfaces.py'
      - 'tests/test_boundary_match.py'
permissions:
  contents: read
jobs:
  verify:
    if: ${{ github.repository == 'timlincool/plush-pattern-lab' && github.actor == 'timlincool' && github.ref == 'refs/heads/work/stage6-hoof-interface-audit-20261028' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install pinned quality tooling without running untrusted PR
        run: python -m pip install --only-binary=:all: numpy ruff==0.17.2 pytest
      - name: Ruff checks for actual interface implementation and tests
        run: |
          python -m ruff check --config ruff.toml \
            src/plush_pattern_lab/validation/boundary_match.py \
            src/plush_pattern_lab/blender/audit_hoof_interfaces.py \
            scripts/audit_hoof_interfaces.py tests/test_boundary_match.py
          python -m ruff format --check \
            src/plush_pattern_lab/validation/boundary_match.py \
            src/plush_pattern_lab/blender/audit_hoof_interfaces.py \
            scripts/audit_hoof_interfaces.py tests/test_boundary_match.py
      - name: Pure numeric positive and negative ring regression
        run: python -m pytest -q tests/test_boundary_match.py
