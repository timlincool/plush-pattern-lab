name: Temporary owner-controlled packaging and quality probe
on:
  push:
    branches: [work/python-packaging-quality-20261026]
permissions:
  contents: read
jobs:
  package-probe:
    if: github.event_name == 'push' && github.ref == 'refs/heads/work/python-packaging-quality-20261026'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Dependencies from trusted owner branch
        run: 'python -m pip install --only-binary=:all: -r requirements-dev.txt'
      - name: Build and install local Python package without network build dependencies
        run: python -m pip install --no-deps --no-build-isolation -e .
      - name: Report quality baseline before cleanup
        shell: bash
        run: |
          python -m ruff check . --output-format concise || true
          python -m ruff format --check . || true
          python -m ruff check --isolated --select C901,PLR0912,PLR0915 --ignore-noqa --config lint.mccabe.max-complexity=10 --config lint.pylint.max-branches=12 --config lint.pylint.max-statements=50 src scripts tests --output-format concise || true
      - name: Package import smoke
        run: |
          python -c "from plush_pattern_lab.patterns.capped_gore_pattern import make; print('PKG_IMPORT_OK', make(panels=12)['quality']['number_of_distinct_net_pieces'])"
          python -c "from plush_pattern_lab.validation.sewing_quality import evaluate; print('NUMERICAL_MODULE_OK', callable(evaluate))"
      - name: Full tests on exact final workflow allowlist
        shell: bash
        run: |
          rm -f .github/workflows/package-probe.yml
          python scripts/check_quality.py
          python -m compileall -q src scripts tests
          python -m pytest -q
          python -m pip wheel --no-deps --no-build-isolation --wheel-dir "$RUNNER_TEMP/wheels" .
          test -n "$(find "$RUNNER_TEMP/wheels" -maxdepth 1 -name 'plush_pattern_lab-*.whl' -print -quit)"
      - name: Pinned Blender 4.3.2 archive digest and installation
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --connect-timeout 30 \
            https://download.blender.org/release/Blender4.3/blender-4.3.2-linux-x64.tar.xz \
            -o "$RUNNER_TEMP/blender.tar.xz"
          echo "4da1c956673c0485e63054e563ee69198cc8f80d8157dd7592dffc8a6a5592e6  $RUNNER_TEMP/blender.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/blender.tar.xz" -C "$RUNNER_TEMP"
          BLENDER="$RUNNER_TEMP/blender-4.3.2-linux-x64/blender"
          [[ "$("$BLENDER" --version)" == *"Blender 4.3.2"* ]]
          echo "BLENDER=$BLENDER" >> "$GITHUB_ENV"
      - name: Real 48-frame synthetic cloth and finite triangle canaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/verified"
          python scripts/capped_gore_pattern.py --panels 12 --pole-cut-deg 8 \
            --out "$RUNNER_TEMP/verified/capped-spec.json"
          python scripts/plush_gore_pattern.py --radius-mm 55 --half-height-mm 70 \
            --panels 12 --segments 64 --out-prefix "$RUNNER_TEMP/verified/gore"
          "$BLENDER" --disable-autoexec --python-exit-code 1 -b -t 1 \
            --python scripts/verify_bvh_intersection_canary.py -- \
            --report "$RUNNER_TEMP/verified/bvh.json"
          "$BLENDER" --disable-autoexec --python-exit-code 1 -b -t 2 \
            --python scripts/sewing_capped_poc_blender.py -- \
            --spec "$RUNNER_TEMP/verified/capped-spec.json" \
            --output "$RUNNER_TEMP/verified/capped.blend" \
            --report "$RUNNER_TEMP/verified/capped.json" --frames 48
          "$BLENDER" --disable-autoexec --python-exit-code 1 -b -t 2 \
            --python scripts/sewing_poc_blender.py -- \
            --spec "$RUNNER_TEMP/verified/gore.json" \
            --output "$RUNNER_TEMP/verified/gore.blend" \
            --report "$RUNNER_TEMP/verified/gore-report.json" \
            --frames 48 --placement reference_offset
          "$BLENDER" --disable-autoexec --python-exit-code 1 -b -t 1 \
            --python scripts/audit_self_intersections_blender.py -- \
            --input "$RUNNER_TEMP/verified/capped.blend" \
            --case-report "$RUNNER_TEMP/verified/capped.json" \
            --output "$RUNNER_TEMP/verified/capped-triangles.json"
          python scripts/assess_contact_integrity.py \
            --simulation-report "$RUNNER_TEMP/verified/capped.json" \
            --triangle-report "$RUNNER_TEMP/verified/capped-triangles.json" \
            --output "$RUNNER_TEMP/verified/capped-contact.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          directory = Path(os.environ["RUNNER_TEMP"]) / "verified"
          cap = json.loads((directory / "capped.json").read_text())
          gore = json.loads((directory / "gore-report.json").read_text())
          contact = json.loads((directory / "capped-contact.json").read_text())
          gap = cap["final"]["mean_gap_mm"]
          target = cap["final_geometry_quality"]["target_shape"]["rigid_aligned_correspondence_rms_mm"]
          assert abs(gap - 0.00022143) <= 0.00005, ("changed capped seam gap", gap)
          assert abs(target - 0.21584) <= 0.02, ("changed capped target RMS", target)
          assert gore["final"]["mean_gap_mm"] < 0.005
          assert cap["analytical_stitch_weld_topology"]["research_topological_sphere_screen_pass"]
          assert contact["status"] != "RESEARCH_CONTACT_SCREEN_PASSED"
          print("PHYSICS_REGRESSION_PASS", {
              "capped_gap_mm": gap, "capped_target_rms_mm": target,
              "plain_gap_mm": gore["final"]["mean_gap_mm"],
              "contact_gate": contact["status"],
          })
          PY
      - name: Export deterministic formatting patch for review (no write token)
        if: always()
        shell: bash
        run: |
          python -m ruff check . --fix || true
          python -m ruff format .
          python - <<'PY'
          import base64
          import pathlib
          import subprocess

          paths = subprocess.check_output(["git", "diff", "--name-only", "-z"]).split(b"\0")
          for raw in paths:
              if not raw:
                  continue
              path = pathlib.Path(raw.decode("utf-8"))
              if path.suffix != ".py":
                  continue
              print("FMT_FILE_BEGIN:" + path.as_posix())
              encoded = base64.b64encode(path.read_bytes()).decode("ascii")
              for offset in range(0, len(encoded), 400):
                  print("FMT_B64:" + encoded[offset:offset + 400])
              print("FMT_FILE_END")
          print("FMT_COMPLETE")
          PY
