name: Temporary owner-controlled packaging and quality probe
on:
  push:
    branches: [work/python-packaging-quality-20261026]
permissions:
  contents: read
jobs:
  package-probe:
    if: github.event_name == 'push' && github.ref == 'refs/heads/work/python-packaging-quality-20261026'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Dependencies from trusted owner branch
        run: 'python -m pip install --only-binary=:all: -r requirements-dev.txt'
      - name: Build and install local Python package without network build dependencies
        run: python -m pip install --no-deps --no-build-isolation -e .
      - name: Report quality baseline before cleanup
        shell: bash
        run: |
          python -m ruff check . --output-format concise || true
          python -m ruff format --check . || true
          python -m ruff check --isolated --select C901,PLR0912,PLR0915 --ignore-noqa --config lint.mccabe.max-complexity=10 --config lint.pylint.max-branches=12 --config lint.pylint.max-statements=50 src scripts tests --output-format concise || true
      - name: Package import smoke
        run: |
          python -c "from plush_pattern_lab.patterns.capped_gore_pattern import make; print('PKG_IMPORT_OK', make(panels=12)['quality']['number_of_distinct_net_pieces'])"
          python -c "from plush_pattern_lab.validation.sewing_quality import evaluate; print('NUMERICAL_MODULE_OK', callable(evaluate))"
      - name: Full tests on exact final workflow allowlist
        shell: bash
        run: |
          rm -f .github/workflows/package-probe.yml
          python -m compileall -q src scripts tests
          python -m pytest -q
