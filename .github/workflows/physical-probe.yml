name: Temporary owner-only physical prototype validation
on:
  push:
    branches: [work/physical-prototype-kit-20261026]
permissions:
  contents: read
jobs:
  trusted-prototype:
    if: github.event_name == 'push' && github.ref == 'refs/heads/work/physical-prototype-kit-20261026'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install wheel-only owner-reviewed dependencies
        run: 'python -m pip install --only-binary=:all: -r requirements-dev.txt'
      - name: Install local package without foreign build dependencies
        run: python -m pip install --no-deps --no-build-isolation -e .
      - name: Strict source quality and full Python tests
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/physical-probe.yml
          python scripts/check_quality.py
          python -m compileall -q src scripts tests
          python -m pytest -q
      - name: Generate 1-to-1 A4 and Letter prototype sheets and verify manifests
        shell: bash
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/toile"
          python scripts/capped_gore_pattern.py --panels 12 --pole-cut-deg 8 --out "$RUNNER_TEMP/toile/input.json"
          python scripts/build_prototype_kit.py --input "$RUNNER_TEMP/toile/input.json" --output-dir "$RUNNER_TEMP/toile/A4" --paper A4
          python scripts/build_prototype_kit.py --input "$RUNNER_TEMP/toile/input.json" --output-dir "$RUNNER_TEMP/toile/Letter" --paper Letter
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "toile"
          for paper in ("A4", "Letter"):
              directory = root / paper
              m = json.loads((directory / "manifest.json").read_text())
              assert m["piece_count"] == 14
              assert len(m["sheets"]) >= 1
              assert len(list(directory.glob("sheet-*.svg"))) == len(m["sheets"])
              print("PRINTABLE_PROTOTYPE_VERIFIED", paper, m["piece_count"], len(m["sheets"]))
          PY
      - name: Export formatter-only review patch for owner branch
        if: always()
        shell: bash
        run: |
          python -m ruff format .
          python - <<'PY'
          import base64
          import pathlib
          import subprocess

          paths = subprocess.check_output(["git", "diff", "--name-only", "-z"]).split(b"\0")
          for raw in paths:
              if not raw:
                  continue
              path = pathlib.Path(raw.decode("utf-8"))
              if path.suffix != ".py":
                  continue
              print("FMT_FILE_BEGIN:" + path.as_posix())
              encoded = base64.b64encode(path.read_bytes()).decode("ascii")
              for offset in range(0, len(encoded), 400):
                  print("FMT_B64:" + encoded[offset:offset + 400])
              print("FMT_FILE_END")
          print("FMT_COMPLETE")
          PY
      - name: Publish synthetic printable prototype evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: synthetic-plush-toile-print-sheets
          path: ${{ runner.temp }}/toile/
          retention-days: 7
          if-no-files-found: warn
