name: Owner-only final synthetic sample quality verification
on:
  push:
    branches: [work/actual-blender-sample-20261026]
permissions:
  contents: read
jobs:
  final-check:
    if: github.event_name == 'push' && github.ref == 'refs/heads/work/actual-blender-sample-20261026'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install trusted wheels
        run: 'python -m pip install --only-binary=:all: -r requirements-dev.txt'
      - name: Install owner package without network build dependencies
        run: python -m pip install --no-deps --no-build-isolation -e .
      - name: Validate exact four-workflow final tree and frozen research evidence
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/final-sample-qa.yml
          python scripts/check_quality.py
          python -m compileall -q src scripts tests
          python -m pytest -q
          python -m pip wheel --no-deps --no-build-isolation --wheel-dir "$RUNNER_TEMP/wheels" .
