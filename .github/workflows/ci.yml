name: Trusted Python tests
# SECURITY: Never execute contributor-controlled pull_request code.
# External PRs are reviewed as diffs in the GitHub UI, not executed in Actions.
# Only maintainer-pushed main commits or explicit maintainer dispatch run code.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: trusted-tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python-tests:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Dependencies from maintainer-reviewed main only
        run: python -m pip install --only-binary=:all: -r requirements-dev.txt
      - name: Static lint and hard quality limits
        run: |
          python scripts/check_quality_limits.py
          ruff check scripts tests --ignore-noqa
      - name: Syntax and tests on trusted main
        run: |
          python -m compileall -q scripts tests
          python -m pytest -q
