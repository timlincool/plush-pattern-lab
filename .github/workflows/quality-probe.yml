name: Temporary trusted quality validation
on:
  push:
    branches: [work/quality-gates-20261025]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install wheel-only dependencies
        run: python -m pip install --only-binary=:all: -r requirements-dev.txt
      - name: Hard quality limits and Ruff
        run: |
          python scripts/check_quality_limits.py
          ruff check scripts tests --ignore-noqa
      - name: Functional tests excluding temporary workflow policy
        if: always()
        run: python -m pytest -q -k 'not workflow'
