name: Temporary trusted quality validation
on:
  push:
    branches: [work/quality-gates-20261025]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install wheel-only dependencies
        run: 'python -m pip install --only-binary=:all: -r requirements-dev.txt'
      - name: Hard quality limits and Ruff
        run: |
          python scripts/check_quality_limits.py
          ruff check scripts tests --ignore-noqa
      - name: Functional tests excluding temporary workflow policy
        if: always()
        run: python -m pytest -q -k 'not workflow'
      - name: Download and hash-verify Blender 4.3.2
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --connect-timeout 30 https://download.blender.org/release/Blender4.3/blender-4.3.2-linux-x64.tar.xz -o "$RUNNER_TEMP/blender.tar.xz"
          echo "4da1c956673c0485e63054e563ee69198cc8f80d8157dd7592dffc8a6a5592e6  $RUNNER_TEMP/blender.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/blender.tar.xz" -C "$RUNNER_TEMP"
          echo "BLENDER=$RUNNER_TEMP/blender-4.3.2-linux-x64/blender" >> "$GITHUB_ENV"
      - name: Regress real capped and plain sewing physics after refactoring
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/verified"
          python scripts/capped_gore_pattern.py --panels 12 --pole-cut-deg 8 --out "$RUNNER_TEMP/verified/capped.json"
          python scripts/plush_gore_pattern.py --radius-mm 55 --half-height-mm 70 --panels 12 --segments 64 --out-prefix "$RUNNER_TEMP/verified/gore"
          "$BLENDER" --disable-autoexec --python-exit-code 1 -b -t 2 --python scripts/sewing_capped_poc_blender.py -- --spec "$RUNNER_TEMP/verified/capped.json" --output "$RUNNER_TEMP/verified/capped.blend" --report "$RUNNER_TEMP/verified/capped_report.json" --frames 48
          "$BLENDER" --disable-autoexec --python-exit-code 1 -b -t 2 --python scripts/sewing_poc_blender.py -- --spec "$RUNNER_TEMP/verified/gore.json" --output "$RUNNER_TEMP/verified/gore.blend" --report "$RUNNER_TEMP/verified/gore_report.json" --frames 48 --placement reference_offset
          test -s "$RUNNER_TEMP/verified/capped_report.json"
          test -s "$RUNNER_TEMP/verified/gore_report.json"
      - name: Independently re-open generated Blender asset in safe preflight
        shell: bash
        run: |
          set -euo pipefail
          SHA="$(sha256sum "$RUNNER_TEMP/verified/capped.blend" | cut -d' ' -f1)"
          "$BLENDER" --disable-autoexec --python-exit-code 1 -b -t 1 --python scripts/audit_public_blend.py -- --input "$RUNNER_TEMP/verified/capped.blend" --output "$RUNNER_TEMP/verified/public_audit.json" --source-sha256 "$SHA"
          test -s "$RUNNER_TEMP/verified/public_audit.json"
