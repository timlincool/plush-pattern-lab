name: Stage 6 actual hoof seam reference
# Never execute untrusted pull_request code or external .blend from PRs.
on:
  push:
    branches: [main]
    paths:
      - 'src/plush_pattern_lab/**'
      - 'src/plush_pattern_lab/patterns/hoof_seam_reference.py'
      - 'src/plush_pattern_lab/validation/boundary_match.py'
      - 'src/plush_pattern_lab/blender/export_stage6_hoof_seams.py'
      - 'src/plush_pattern_lab/blender/audit_hoof_interfaces.py'
      - 'scripts/export_stage6_hoof_seams.py'
      - 'scripts/probe_stage6_seam_band.py'
      - 'scripts/probe_stage6_scene_inventory.py'
      - 'scripts/probe_stage6_core_shell.py'
      - 'scripts/build_stage6_core_proxy.py'
      - 'scripts/audit_stage6_proxy_surface.py'
      - 'scripts/propose_stage6_shell_panels.py'
      - 'scripts/unroll_stage6_leftfront.py'
      - 'scripts/compare_stage6_leftfront_fairing.py'
      - 'scripts/compare_stage6_multidisk_radial.py'
      - 'scripts/compare_stage6_uv_solvers.py'
      - 'scripts/compare_stage6_tutte_control.py'
      - 'scripts/audit_stage6_face_seams.py'
      - 'scripts/audit_stage6_full_mesh_visibility.py'
      - 'scripts/render_stage6_full_mesh_seam_views.py'
      - 'scripts/compare_stage6_b2_reroute_ab.py'
      - 'scripts/audit_stage6_b2_reroute_visibility.py'
      - 'scripts/build_stage6_lower_mother_toile.py'
      - 'scripts/build_stage6_upper_mother_toile.py'
      - 'scripts/build_stage6_split_volume_toile_ab.py'
      - 'scripts/audit_stage6_true_source_sections.py'
      - 'scripts/audit_stage6_section_mesh_correspondence.py'
      - 'scripts/audit_stage6_source_slab_continuity.py'
      - '.github/workflows/stage6-hoof-seam-reference.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stage6-hoof-reference:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Fetch and check exact public Blender 4.3.2
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --connect-timeout 30 --max-time 360 \
            https://download.blender.org/release/Blender4.3/blender-4.3.2-linux-x64.tar.xz \
            -o "$RUNNER_TEMP/blender.tar.xz"
          echo "4da1c956673c0485e63054e563ee69198cc8f80d8157dd7592dffc8a6a5592e6  $RUNNER_TEMP/blender.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/blender.tar.xz" -C "$RUNNER_TEMP"
          BLENDER="$RUNNER_TEMP/blender-4.3.2-linux-x64/blender"
          [[ "$("$BLENDER" --version)" == *"Blender 4.3.2"* ]]
          echo "BLENDER=$BLENDER" >> "$GITHUB_ENV"
      - name: Download verified public Stage 6 (no auth)
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --connect-timeout 30 --max-time 360 \
            https://github.com/timlincool/plush-pattern-lab/releases/download/cloud-alpaca-stage6-visuals-20261028/cloud-alpaca-stage6.blend \
            -o "$RUNNER_TEMP/stage6.blend"
          test "$(stat -c%s "$RUNNER_TEMP/stage6.blend")" -eq 89853017
          echo "38a0be58ed4cb6b3af66fc392f4820d544851715002ee8520543d7e9fba85f3a  $RUNNER_TEMP/stage6.blend" | sha256sum -c -
      - name: Read-only Stage 6 boundary mapping and SVG reference
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/stage6-reference"
          "$BLENDER" --disable-autoexec --python-exit-code 1 -b -t 1 \
            --python scripts/export_stage6_hoof_seams.py -- \
            --input "$RUNNER_TEMP/stage6.blend" \
            --source-sha256 38a0be58ed4cb6b3af66fc392f4820d544851715002ee8520543d7e9fba85f3a \
            --output "$RUNNER_TEMP/stage6-reference/seam_reference.json" \
            --svg "$RUNNER_TEMP/stage6-reference/seam_reference.svg"
          python - <<'PY'
          import json, os, pathlib
          path = pathlib.Path(os.environ['RUNNER_TEMP'])/'stage6-reference/seam_reference.json'
          obj = json.loads(path.read_text(encoding='utf8'))
          assert obj['status'] == 'STAGE6_HOOF_SEAM_REFERENCE_NOT_CUT_PATTERN'
          assert obj['source_sha256'] == '38a0be58ed4cb6b3af66fc392f4820d544851715002ee8520543d7e9fba85f3a'
          assert obj['quality']['matched_interfaces'] == 4
          assert obj['quality']['all_3d_geometry_interfaces_match']
          assert not obj['quality']['approved_cut_patterns']
          assert len(obj['hoofs']) == 4
          assert all(x['vertex_count'] == 512 and len(x['notches']) == 4 for x in obj['hoofs'])
          print('STAGE6_2D_SEAM_REFERENCE_PASS', json.dumps([
              {'hoof': h['hoof'], 'perimeter_3d_mm': h['projection_diagnostics']['perimeter_3d_mm'],
               'projection_loss_mm': h['projection_diagnostics']['projection_length_loss_mm'],
               'max_out_of_plane_mm': h['projection_diagnostics']['max_out_of_plane_mm']}
              for h in obj['hoofs']]))
          PY
      - name: Survey true Stage 6 boundary-adjacent mesh faces (no flattening)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/stage6-raw"
          "$BLENDER" --disable-autoexec --python-exit-code 1 -b -t 1 \
            --python scripts/probe_stage6_seam_band.py -- \
            --input "$RUNNER_TEMP/stage6.blend" \
            --source-sha256 38a0be58ed4cb6b3af66fc392f4820d544851715002ee8520543d7e9fba85f3a \
            --output "$RUNNER_TEMP/stage6-reference/adjacent_face_survey.json" \
            --geometry-output "$RUNNER_TEMP/stage6-raw/patch_geometry.json"
          python - <<'PY'
          import json, os, pathlib
          file = pathlib.Path(os.environ['RUNNER_TEMP'])/'stage6-reference/adjacent_face_survey.json'
          data = json.loads(file.read_text(encoding='utf8'))
          assert data['schema'] == 'stage6-adjacent-face-topology-v1'
          assert data['status'] == 'TOPOLOGY_SURVEY_ONLY_NO_FLATTENING'
          assert data['all_original_3d_seams_match']
          assert len(data['objects']) == 5
          assert [len(obj['rings']) for obj in data['objects']] == [4, 1, 1, 1, 1]
          assert all(ring['boundary_vertices'] == 512 for obj in data['objects'] for ring in obj['rings'])
          assert all('vertex_one_ring_patch' in ring for obj in data['objects'] for ring in obj['rings'])
          assert all('plane_projection_baseline' in ring for obj in data['objects'] for ring in obj['rings'] if ring['vertex_one_ring_patch']['candidate_triangular_annulus'])
          print('STAGE6_REAL_ADJACENT_FACE_SURVEY', json.dumps([
              {'object': row['object'], 'rings': [{
                  'index': item['ring_index'],
                  'polygons': item['polygon_vertex_counts'],
                  'regular_quad_strip': item['regular_quad_strip'],
                  'reason': item.get('quad_strip_failure_reason', ''),
                  'triangle_patch': item['vertex_one_ring_patch'],
                  'plane_projection': item.get('plane_projection_baseline', {}),
              } for item in row['rings']]} for row in data['objects']]))
          PY
      - name: Audit full public Stage6 scene for component planning
        shell: bash
        run: |
          set -euo pipefail
          "$BLENDER" --disable-autoexec --python-exit-code 1 -b -t 1 \
            --python scripts/probe_stage6_scene_inventory.py -- \
            --input "$RUNNER_TEMP/stage6.blend" \
            --source-sha256 38a0be58ed4cb6b3af66fc392f4820d544851715002ee8520543d7e9fba85f3a \
            --output "$RUNNER_TEMP/stage6-reference/whole_scene_inventory.json"
          python - <<'PY'
          import json, os, pathlib
          p = pathlib.Path(os.environ['RUNNER_TEMP'])/'stage6-reference/whole_scene_inventory.json'
          result = json.loads(p.read_text(encoding='utf8'))
          assert result['schema'] == 'stage6-whole-scene-component-triage-v1'
          assert result['source_sha256'] == '38a0be58ed4cb6b3af66fc392f4820d544851715002ee8520543d7e9fba85f3a'
          assert result['core_body_and_four_hoof_meshes_present']
          assert result['mesh_objects_total'] >= 5
          assert result['scene_objects_total'] >= result['mesh_objects_total']
          assert not result['all_sewable_panels_identified']
          assert not result['factory_handoff_ready']
          print('STAGE6_WHOLE_SCENE_TRIAGE_PASS', json.dumps({
              'total': result['scene_objects_total'],
              'types': result['object_types'],
              'mesh': result['mesh_objects_total'],
              'role_hints': result['mesh_role_hint_counts_nonexclusive'],
          }))
          PY
      - name: Verify actual Stage6 main-shell face topology before proxy work
        shell: bash
        run: |
          set -euo pipefail
          "$BLENDER" --disable-autoexec --python-exit-code 1 -b -t 1 \
            --python scripts/probe_stage6_core_shell.py -- \
            --input "$RUNNER_TEMP/stage6.blend" \
            --source-sha256 38a0be58ed4cb6b3af66fc392f4820d544851715002ee8520543d7e9fba85f3a \
            --output "$RUNNER_TEMP/stage6-reference/core_shell_topology.json"
          python - <<'PY'
          import json, os, pathlib
          p = pathlib.Path(os.environ['RUNNER_TEMP'])/'stage6-reference/core_shell_topology.json'
          obj = json.loads(p.read_text(encoding='utf8'))
          assert obj['schema'] == 'stage6-core-shell-mesh-topology-v1'
          assert obj['source_sha256'] == '38a0be58ed4cb6b3af66fc392f4820d544851715002ee8520543d7e9fba85f3a'
          assert obj['faces'] == 466278
          assert obj['verified_body_hoof_3d_pair_count'] == 4
          assert obj['boundary_loop_vertex_counts'] == [512, 512, 512, 512]
          assert not obj['low_poly_proxy_created']
          assert not obj['cutting_patterns_approved']
          assert not obj['whole_model_modified']
          print('STAGE6_MAIN_SHELL_TOPOLOGY_RESEARCH', json.dumps({
              'vertices': obj['vertices'], 'edges': obj['edges'],
              'faces': obj['faces'], 'euler': obj['euler_characteristic'],
              'face_components': obj['face_components_by_shared_edge'],
              'edge_incidence': obj['edge_incidence'],
              'proxy_candidate': obj['candidate_for_non_destructive_proxy_experiment'],
          }))
          PY
      - name: Trial two protected real Stage6 core shell decimations (NOT cut panels)
        shell: bash
        run: |
          set -euo pipefail
          "$BLENDER" --disable-autoexec --python-exit-code 1 -b -t 1 \
            --python scripts/build_stage6_core_proxy.py -- \
            --input "$RUNNER_TEMP/stage6.blend" \
            --source-sha256 38a0be58ed4cb6b3af66fc392f4820d544851715002ee8520543d7e9fba85f3a \
            --output "$RUNNER_TEMP/stage6-reference/core_shell_proxy_ab.json" \
            --proxy-dir "$RUNNER_TEMP/stage6-proxy-candidates"
          python - <<'PY'
          import json, os, pathlib
          path = pathlib.Path(os.environ['RUNNER_TEMP'])/'stage6-reference/core_shell_proxy_ab.json'
          report = json.loads(path.read_text(encoding='utf8'))
          assert report['schema'] == 'stage6-protected-core-shell-proxy-ab-v1'
          assert report['source_sha256'] == '38a0be58ed4cb6b3af66fc392f4820d544851715002ee8520543d7e9fba85f3a'
          assert report['original_mesh_counts']['faces'] == 466278
          assert [r['requested_triangle_ratio'] for r in report['trials']] == [0.5, 0.25]
          assert report['all_original_source_counts_unchanged']
          assert report['approved_cut_patterns'] == 0
          assert not report['complete_character_panels']
          assert all(not r['accepted_for_pattern_cutting'] for r in report['trials'])
          print('STAGE6_REAL_PROXY_CANDIDATE_REPORT', json.dumps([
              {'ratio': r['requested_triangle_ratio'], 'faces': r['actual_faces'],
               'source_preserved': r['source_object_modified'] is False,
               'research_ply_exported': r['proxy_exported'],
               'rejection': r.get('rejection')} for r in report['trials']
          ]))
          PY
      - name: Upload derived research proxy PLY only (never source blend)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: stage6-core-shell-research-ply
          path: ${{ runner.temp }}/stage6-proxy-candidates/*.ply
          if-no-files-found: warn
          retention-days: 7
      - name: Independently inspect real Stage6 proxy winding, intersections, five views
        shell: bash
        run: |
          set -euo pipefail
          "$BLENDER" --disable-autoexec --python-exit-code 1 -b -t 1 \
            --python scripts/audit_stage6_proxy_surface.py -- \
            --input "$RUNNER_TEMP/stage6.blend" \
            --source-sha256 38a0be58ed4cb6b3af66fc392f4820d544851715002ee8520543d7e9fba85f3a \
            --proxy-dir "$RUNNER_TEMP/stage6-proxy-candidates" \
            --output "$RUNNER_TEMP/stage6-reference/proxy_independent_screen.json"
          python - <<'PY'
          import json, os, pathlib
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          p = root/'stage6-reference/proxy_independent_screen.json'
          data = json.loads(p.read_text(encoding='utf8'))
          assert data['schema'] == 'stage6-real-proxy-independent-geometry-screen-v1'
          assert data['source_sha256'] == '38a0be58ed4cb6b3af66fc392f4820d544851715002ee8520543d7e9fba85f3a'
          assert len(data['results']) == 2 and data['source_main_mesh_faces'] == 466278
          assert data['bvh_nonadjacent_crossing_canary_passed']
          assert not data['approved_cut_patterns'] and not data['manufacturing_production_ready']
          assert all(len(m['orthographic_first_hit']) == 5 for m in data['results'])
          assert all(m['nonadjacent_bvh']['nonadjacent_triangle_intersection_pairs'] >= 0 for m in data['results'])
          for item in data['results']:
              source = root/'stage6-proxy-candidates'/item['five_view_overlay_png']
              target = root/'stage6-reference'/item['five_view_overlay_png']
              target.write_bytes(source.read_bytes())
          print('STAGE6_PROXY_INDEPENDENT_5VIEW_SCREEN', json.dumps([
              {'mesh': m['research_ply'],
               'winding': m['face_winding']['coherent_face_winding'],
               'bvh_nonadjacent': m['nonadjacent_bvh']['nonadjacent_triangle_intersection_pairs'],
               'front_iou': m['orthographic_first_hit']['front']['silhouette_iou'],
               'front_depth_p95': m['orthographic_first_hit']['front']['first_hit_depth_mm']['p95']}
              for m in data['results']
          ]))
          PY
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Pinned Python research dependencies (reviewed main only)
        run: 'python -m pip install --only-binary=:all: -r requirements-dev.txt'
      - name: Install reviewed source package for Python CLI
        run: python -m pip install --no-deps --no-build-isolation -e .
      - name: Draft true Stage6 full-shell four-region matched 3D seam graph
        shell: bash
        run: |
          set -euo pipefail
          python scripts/propose_stage6_shell_panels.py \
            --input "$RUNNER_TEMP/stage6-proxy-candidates/core_shell_proxy_ratio_0.25.ply" \
            --source-sha256 38a0be58ed4cb6b3af66fc392f4820d544851715002ee8520543d7e9fba85f3a \
            --output "$RUNNER_TEMP/stage6-reference/four_region_seam_graph.json" \
            --svg "$RUNNER_TEMP/stage6-reference/four_region_3d_top_view.svg"
          python - <<'PY'
          import json, os, pathlib
          p = pathlib.Path(os.environ['RUNNER_TEMP'])/'stage6-reference/four_region_seam_graph.json'
          report = json.loads(p.read_text(encoding='utf-8'))
          assert report['schema'] == 'stage6-source-pinned-whole-shell-seam-plan-v1'
          assert report['source_original_model_sha256'] == '38a0be58ed4cb6b3af66fc392f4820d544851715002ee8520543d7e9fba85f3a'
          assert len(report['scenarios']) == 2
          assert all(c['source_triangles'] == 116568 for c in report['scenarios'])
          assert all(c['all_regions_single_connected_annuli_with_one_complete_hoof'] for c in report['scenarios'])
          assert all(len(c['regions']) == 4 for c in report['scenarios'])
          assert not report['fabric_cut_pattern_approved'] and not report['real_2d_net_seams']
          print('STAGE6_FOUR_REGION_REAL_TOPOLOGICAL_PARTITION', json.dumps([
              {'split_y': c['split_y_mm'], 'faces': [p['face_count'] for p in c['regions']],
               'interfaces': c['total_shared_3d_seam_edges'],
               'shared_seam_mm': c['total_shared_3d_seam_length_mm'],
               'four_way_junctions': c['shared_seam_junction_vertices_over_two'],
               'one_cuff_each': all(r['source_hoof_boundary_edges'] == 512 for r in c['regions'])}
              for c in report['scenarios']
          ]))
          PY
      - name: Slit and unwrap the complete real Stage6 left-front 36833-face panel
        shell: bash
        run: |
          set -euo pipefail
          python scripts/unroll_stage6_leftfront.py \
            --input "$RUNNER_TEMP/stage6-proxy-candidates/core_shell_proxy_ratio_0.25.ply" \
            --source-sha256 38a0be58ed4cb6b3af66fc392f4820d544851715002ee8520543d7e9fba85f3a \
            --summary "$RUNNER_TEMP/stage6-reference/leftfront_unroll_summary.json" \
            --detail "$RUNNER_TEMP/stage6-reference/leftfront_unroll_detail.json" \
            --svg "$RUNNER_TEMP/stage6-reference/leftfront_research_net.svg" \
            --iterations 8000
          python - <<'PY'
          import json, os, pathlib
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'stage6-reference'
          report = json.loads((root/'leftfront_unroll_summary.json').read_text(encoding='utf8'))
          assert report['schema'] == 'stage6-leftfront-whole-panel-lscm-v1'
          assert report['source_original_model_sha256'] == '38a0be58ed4cb6b3af66fc392f4820d544851715002ee8520543d7e9fba85f3a'
          assert report['region'] == 'left_front'
          assert report['topology']['original_annulus_faces'] == 36833
          assert report['topology']['source_cuff_edges'] == 512
          assert report['topology']['cut_disk_euler'] == 1
          assert report['geometry_quality']['boundary']['perimeter_by_source_role']['hoof']['edge_count'] == 512
          assert not report['net_cut_pattern_approved']
          assert not report['manufacturing_ready']
          print('STAGE6_REAL_LEFTFRONT_3D_TO_2D_RESEARCH', json.dumps({
              'status': report['status'],
              'slit_mm': report['topology']['slit_path_length_3d_mm'],
              'disk_vertices': report['topology']['cut_disk_vertices'],
              'p95_edge_error': report['geometry_quality']['strain_screen']['triangle_edge_relative_error']['p95'],
              'flips': report['geometry_quality']['strain_screen']['inverted_winding_triangles'],
              'overlap_pairs': report['geometry_quality']['global_2d_overlap']['overlapping_nonzero_area_triangle_pairs'],
              'not_approved': True,
          }))
          PY
      - name: Compare real seam-frozen leftfront manufacture-surface A/B and full UV
        shell: bash
        run: |
          set -euo pipefail
          python scripts/compare_stage6_leftfront_fairing.py \
            --input "$RUNNER_TEMP/stage6-proxy-candidates/core_shell_proxy_ratio_0.25.ply" \
            --source-sha256 38a0be58ed4cb6b3af66fc392f4820d544851715002ee8520543d7e9fba85f3a \
            --baseline "$RUNNER_TEMP/stage6-reference/leftfront_unroll_summary.json" \
            --output "$RUNNER_TEMP/stage6-reference/leftfront_manufacturing_surface_ab.json"
          python - <<'PY'
          import json, os, pathlib
          file = pathlib.Path(os.environ['RUNNER_TEMP'])/'stage6-reference/leftfront_manufacturing_surface_ab.json'
          data = json.loads(file.read_text(encoding='utf8'))
          assert data['schema'] == 'stage6-real-leftfront-seam-locked-surface-ab-v1'
          assert data['source_original_blend_sha256'] == '38a0be58ed4cb6b3af66fc392f4820d544851715002ee8520543d7e9fba85f3a'
          assert data['source_region_faces'] == 36833
          assert data['source_protected_3d_vertices'] == 1024
          assert [row['trial'] for row in data['trials']] == ['A_light', 'B_strong']
          assert all(row['all_original_sewing_seam_coordinates_exact'] for row in data['trials'])
          assert all(not row['accepted_for_production'] for row in data['trials'])
          assert not data['manufacturer_seam_or_cut_pattern_approved']
          print('STAGE6_FAIRING_AB_3D_SOURCE_SEAMS_PROTECTED_NO_CUT_PATTERNS')
          PY
      - name: Partition actual leftfront into source-paired two/three disks and audit UV
        shell: bash
        run: |
          set -euo pipefail
          python scripts/compare_stage6_multidisk_radial.py \
            --input "$RUNNER_TEMP/stage6-proxy-candidates/core_shell_proxy_ratio_0.25.ply" \
            --source-sha256 38a0be58ed4cb6b3af66fc392f4820d544851715002ee8520543d7e9fba85f3a \
            --baseline "$RUNNER_TEMP/stage6-reference/leftfront_unroll_summary.json" \
            --summary "$RUNNER_TEMP/stage6-reference/leftfront_multidisk_summary.json" \
            --detail "$RUNNER_TEMP/stage6-reference/leftfront_multidisk_detail.json"
          python - <<'PY'
          import json, os, pathlib
          p = pathlib.Path(os.environ['RUNNER_TEMP'])/'stage6-reference/leftfront_multidisk_summary.json'
          d = json.loads(p.read_text(encoding='utf8'))
          assert d['schema'] == 'stage6-source-pinned-multi-disk-lscm-research-v1'
          assert d['source_blend_sha256'] == '38a0be58ed4cb6b3af66fc392f4820d544851715002ee8520543d7e9fba85f3a'
          assert d['source_original_leftfront_faces'] == 36833
          assert [r['disk_count'] for r in d['candidates']] == [2, 3]
          assert all(r['all_source_faces_preserved_once'] for r in d['candidates'])
          assert all(r['all_3d_radial_seam_edges_paired_exactly'] for r in d['candidates'])
          assert all(not r['approved_for_cutting'] for r in d['candidates'])
          assert d['approved_cutting_patterns'] == 0
          print('STAGE6_REAL_TWO_THREE_DISK_SEAM_PAIRING_NO_CUTTING', json.dumps([
              {'candidate': r['candidate'], 'faces': r['individual_panel_face_counts'],
               'extra_seam_mm': r['extra_radial_seam_mm'],
               'uv_status': [p['status'] for p in r['panel_uv_quality']]}
              for r in d['candidates']
          ]))
          PY
      - name: Recheck actual B three disks with independent scale and ARAP UV solvers
        shell: bash
        run: |
          set -euo pipefail
          python scripts/compare_stage6_uv_solvers.py \
            --input "$RUNNER_TEMP/stage6-proxy-candidates/core_shell_proxy_ratio_0.25.ply" \
