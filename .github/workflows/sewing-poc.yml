name: Synthetic 2D-pattern sewing PoC
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/sewing_poc_blender.py'
      - 'scripts/cloth_solver_canary.py'
      - 'scripts/plush_gore_pattern.py'
      - 'scripts/sewing_quality.py'
      - 'scripts/assess_research_candidate.py'
      - 'src/plush_pattern_lab/**'
      - '.github/workflows/sewing-poc.yml'
permissions:
  contents: read
jobs:
  blender-sewing:
    # Only a maintainer-reviewed default-branch commit is executable.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Geometry dependencies
        run: 'python -m pip install --only-binary=:all: -r requirements-dev.txt'
      - name: Generate synthetic 8 and 12-piece 2D rest patterns
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sewing"
          python scripts/plush_gore_pattern.py --radius-mm 55 --half-height-mm 70 \
            --panels 8 --segments 64 --out-prefix "$RUNNER_TEMP/sewing/8gore"
          python scripts/plush_gore_pattern.py --radius-mm 55 --half-height-mm 70 \
            --panels 12 --segments 64 --out-prefix "$RUNNER_TEMP/sewing/12gore"
      - name: Download and verify Blender 4.3.2
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --connect-timeout 30 \
            https://download.blender.org/release/Blender4.3/blender-4.3.2-linux-x64.tar.xz \
            -o "$RUNNER_TEMP/blender.tar.xz"
          # Pinned digest from the official Blender 4.3.2 SHA256 manifest.
          echo "4da1c956673c0485e63054e563ee69198cc8f80d8157dd7592dffc8a6a5592e6  $RUNNER_TEMP/blender.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/blender.tar.xz" -C "$RUNNER_TEMP"
          B="$RUNNER_TEMP/blender-4.3.2-linux-x64/blender"
          [[ "$("$B" --version)" == *"Blender 4.3.2"* ]]
          echo "BLENDER=$B" >> "$GITHUB_ENV"
      - name: Verify numerical Cloth solver responds to gravity
        shell: bash
        run: |
          set -euo pipefail
          for MODE in plain rest; do
            "$BLENDER" --disable-autoexec --python-exit-code 1 -b -t 2 \
              --python scripts/cloth_solver_canary.py -- "$RUNNER_TEMP/sewing/solver_canary_$MODE.json" "$MODE"
          done
      - name: Actual Blender Cloth sewn-shape A/B experiments (not manufacturing)
        shell: bash
        run: |
          set -euo pipefail
          for MODE in legacy reference_offset; do
            "$BLENDER" --disable-autoexec --python-exit-code 1 -b -t 2 \
              --python scripts/sewing_poc_blender.py -- \
              --spec "$RUNNER_TEMP/sewing/8gore.json" \
              --output "$RUNNER_TEMP/sewing/2d_sewing_${MODE}.blend" \
              --report "$RUNNER_TEMP/sewing/sewing_report_${MODE}.json" \
              --frames 48 --placement "$MODE"
            test -s "$RUNNER_TEMP/sewing/sewing_report_${MODE}.json"
            test -s "$RUNNER_TEMP/sewing/2d_sewing_${MODE}.blend"
          done
          "$BLENDER" --disable-autoexec --python-exit-code 1 -b -t 2 \
            --python scripts/sewing_poc_blender.py -- \
            --spec "$RUNNER_TEMP/sewing/12gore.json" \
            --output "$RUNNER_TEMP/sewing/2d_sewing_reference_12.blend" \
            --report "$RUNNER_TEMP/sewing/sewing_report_reference_12.json" \
            --frames 48 --placement reference_offset
      - name: Evaluate selection gate; failed candidates are preserved as research evidence
        shell: bash
        run: |
          set -euo pipefail
          for NAME in legacy reference_offset reference_12; do
            python scripts/assess_research_candidate.py \
              --report "$RUNNER_TEMP/sewing/sewing_report_${NAME}.json" \
              --output "$RUNNER_TEMP/sewing/candidate_gate_${NAME}.json"
          done
      - name: Record seam-versus-shape A/B; research execution is not shape approval
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,pathlib
          out=pathlib.Path(os.environ["RUNNER_TEMP"])/"sewing"
          rows=[]
          for name in ("legacy","reference_offset","reference_12"):
              d=json.loads((out/("sewing_report_"+name+".json")).read_text())
              q=d["final_geometry_quality"]
              decision=json.loads((out/("candidate_gate_"+name+".json")).read_text())
              rows.append({
                  "variant":name,
                  "research_gate":decision["status"],
                  "failed_metrics":[f["metric"] for f in decision["failed_checks"]],
                  "panel_count":d["synthetic_panel_count"],
                  "seam_mean_gap_mm":d["final"]["mean_gap_mm"],
                  "aligned_target_rms_mm":q["target_shape"]["rigid_aligned_correspondence_rms_mm"],
                  "p95_principal_strain":q["strain"]["p95_abs_principal_strain"],
                  "flipped_triangles":q["strain"]["orientation_reversed_vs_initial"],
                  "end_flips":q["strain"]["endpoint_region_flips"],
                  "interior_flips":q["strain"]["interior_region_flips"]})
          (out/"ab_quality_comparison.json").write_text(json.dumps({
              "status":"COMPARISON_ONLY_NOT_MANUFACTURING_APPROVED",
              "cases":rows},indent=2))
          print("SEWING_SHAPE_AB",json.dumps(rows))
          PY
      # 仿真 .blend 为可重算的临时场景，不上传至 Actions 存储。
      - name: Preserve compact numerical reports and 2D pattern previews
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: synthetic-plush-2d-sewing-evidence
          path: |
            ${{ runner.temp }}/sewing/*.json
            ${{ runner.temp }}/sewing/*.svg
          retention-days: 3
          if-no-files-found: warn
