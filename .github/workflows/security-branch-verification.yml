name: Temporary trusted security branch verification
on:
  push:
    branches: [work/pr-security-hardening-20261025]
    paths:
      - 'tests/test_workflow_security.py'
      - 'requirements-dev.txt'
      - '.github/workflows/security-branch-verification.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  trusted-check:
    if: github.ref == 'refs/heads/work/pr-security-hardening-20261025'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Do not include temporary trusted verification workflow in release policy
        run: rm .github/workflows/security-branch-verification.yml
      - name: Run security negative tests and all existing unit tests
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pytest -q
