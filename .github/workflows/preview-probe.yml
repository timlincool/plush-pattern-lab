name: Owner-only actual synthetic sample render and collision preview
on:
  push:
    branches: [work/actual-blender-sample-20261026]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collision-study:
    # Only a maintainer-reviewed default-branch commit is executable.
    if: github.ref == 'refs/heads/work/actual-blender-sample-20261026' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install geometry tools
        run: 'python -m pip install --only-binary=:all: -r requirements-dev.txt'
      - name: Owner-only strict quality tests on final workflow list
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/preview-probe.yml
          python -m pip install --no-deps --no-build-isolation -e .
          python scripts/check_quality.py
          python -m compileall -q src scripts tests
          python -m pytest -q
      - name: Refuse fake contact pass, corrupt input, and missing evidence
        run: python -m pytest -q tests/test_contact_integrity.py
      - name: Synthesize clean 12-gore + two-cap rest pattern
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/collision"
          python scripts/capped_gore_pattern.py --panels 12 --pole-cut-deg 8 \
            --out "$RUNNER_TEMP/collision/pattern.json"
      - name: Download version-locked Blender 4.3.2
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --connect-timeout 30 \
            https://download.blender.org/release/Blender4.3/blender-4.3.2-linux-x64.tar.xz \
            -o "$RUNNER_TEMP/blender.tar.xz"
          # Pinned digest from the official Blender 4.3.2 SHA256 manifest.
          echo "4da1c956673c0485e63054e563ee69198cc8f80d8157dd7592dffc8a6a5592e6  $RUNNER_TEMP/blender.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/blender.tar.xz" -C "$RUNNER_TEMP"
          B="$RUNNER_TEMP/blender-4.3.2-linux-x64/blender"
          [[ "$("$B" --version)" == *"Blender 4.3.2"* ]]
          echo "BLENDER=$B" >> "$GITHUB_ENV"
      - name: Independent deliberately crossing / separated triangle canaries
        shell: bash
        run: |
          set -euo pipefail
          "$BLENDER" --disable-autoexec --python-exit-code 1 -b -t 1 \
            --python scripts/verify_bvh_intersection_canary.py -- \
            --report "$RUNNER_TEMP/collision/bvh_canary.json"
      - name: Same pattern, zero gravity, collisions OFF / ON
        shell: bash
        run: |
          set -euo pipefail
          for MODE in disabled enabled; do
            EXTRA=()
            if [[ "$MODE" == "enabled" ]]; then EXTRA=(--self-collision); fi
            "$BLENDER" --disable-autoexec --python-exit-code 1 -b -t 2 \
              --python scripts/sewing_capped_poc_blender.py -- \
              --spec "$RUNNER_TEMP/collision/pattern.json" \
              --output "$RUNNER_TEMP/collision/$MODE.blend" \
              --report "$RUNNER_TEMP/collision/$MODE.json" --frames 48 "${EXTRA[@]}"
            python scripts/assess_research_candidate.py \
              --report "$RUNNER_TEMP/collision/$MODE.json" \
              --output "$RUNNER_TEMP/collision/$MODE.research_gate.json"
          done
      - name: Independently reopen two saved .blend snapshots and classify nonadjacent triangle intersections
        shell: bash
        run: |
          set -euo pipefail
          for MODE in disabled enabled; do
            "$BLENDER" --disable-autoexec --python-exit-code 1 -b -t 1 \
              --python scripts/audit_self_intersections_blender.py -- \
              --input "$RUNNER_TEMP/collision/$MODE.blend" \
              --case-report "$RUNNER_TEMP/collision/$MODE.json" \
              --output "$RUNNER_TEMP/collision/$MODE.triangles.json"
          done
      - name: Independent contact veto (execution can succeed but research candidate can fail)
        shell: bash
        run: |
          set -euo pipefail
          for MODE in disabled enabled; do
            python scripts/assess_contact_integrity.py \
              --simulation-report "$RUNNER_TEMP/collision/$MODE.json" \
              --triangle-report "$RUNNER_TEMP/collision/$MODE.triangles.json" \
              --output "$RUNNER_TEMP/collision/$MODE.contact_gate.json"
          done
      - name: Render real saved synthetic mesh in studio and contact diagnostic views
        shell: bash
        run: |
          set -euo pipefail
          for MODE in disabled enabled; do
            "$BLENDER" --disable-autoexec --python-exit-code 1 -b -t 2 \
              --python scripts/render_synthetic_evidence.py -- \
              --input "$RUNNER_TEMP/collision/$MODE.blend" \
              --simulation-report "$RUNNER_TEMP/collision/$MODE.json" \
              --triangle-report "$RUNNER_TEMP/collision/$MODE.triangles.json" \
              --output-dir "$RUNNER_TEMP/collision/$MODE.preview"
            test -s "$RUNNER_TEMP/collision/$MODE.preview/three_quarter.png"
            test -s "$RUNNER_TEMP/collision/$MODE.preview/side.png"
            test -s "$RUNNER_TEMP/collision/$MODE.preview/lower_join.png"
          done
      - name: Controlled cap-end transition experiment (2 and 4 rows)
        shell: bash
        run: |
          set -euo pipefail
          for ROWS in 2 4; do
            PREFIX="$RUNNER_TEMP/collision/captransition$ROWS"
            "$BLENDER" --disable-autoexec --python-exit-code 1 -b -t 2 \
              --python scripts/sewing_capped_poc_blender.py -- \
              --spec "$RUNNER_TEMP/collision/pattern.json" \
              --output "$PREFIX.blend" --report "$PREFIX.json" \
              --frames 48 --cap-transition-rows "$ROWS"
            python scripts/assess_research_candidate.py \
              --report "$PREFIX.json" --output "$PREFIX.research_gate.json"
            "$BLENDER" --disable-autoexec --python-exit-code 1 -b -t 1 \
              --python scripts/audit_self_intersections_blender.py -- \
              --input "$PREFIX.blend" --case-report "$PREFIX.json" \
              --output "$PREFIX.triangles.json"
            python scripts/assess_contact_integrity.py \
              --simulation-report "$PREFIX.json" \
              --triangle-report "$PREFIX.triangles.json" \
              --output "$PREFIX.contact_gate.json"
          done
      - name: Record local cap transition A-B including unchanged 0-row baseline
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          directory = Path(os.environ["RUNNER_TEMP"]) / "collision"
          rows = []
          for name, taper in (("disabled", 0), ("captransition2", 2), ("captransition4", 4)):
              trial = json.loads((directory / (name + ".json")).read_text())
              triangles = json.loads((directory / (name + ".triangles.json")).read_text())
              decision = json.loads((directory / (name + ".contact_gate.json")).read_text())
              geometry = json.loads((directory / (name + ".research_gate.json")).read_text())
              if trial.get("cap_transition_rows") != taper:
                  raise RuntimeError("Mismatched controlled cap-transition experiment")
              rows.append({
                  "transition_rows": taper,
                  "nonseam_intersections": decision["other_nonadjacent_intersections"],
                  "seam_related_intersections": decision["seam_related_intersections"],
                  "target_rms_mm": trial["final_geometry_quality"]["target_shape"]["rigid_aligned_correspondence_rms_mm"],
                  "strain_p95": trial["final_geometry_quality"]["strain"]["p95_abs_principal_strain"],
                  "seam_gap_mean_mm": trial["final"]["mean_gap_mm"],
                  "geometry_gate": geometry["status"],
                  "contact_gate": decision["status"],
                  "nonseam_regions": [
                      row for row in triangles["localization"]["by_zone_pair"] if row["category"] == "other"
                  ],
              })
          (directory / "cap_transition_ab.json").write_text(
              json.dumps({"status": "RESEARCH_ONLY", "cases": rows}, indent=2)
          )
          print("CAP_TRANSITION_AB", json.dumps(rows))
          PY
      - name: Write directly comparable parameter/quality report
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,pathlib
          root=pathlib.Path(os.environ["RUNNER_TEMP"])/"collision"
          rows=[]
          for mode in ("disabled","enabled"):
              r=json.loads((root/(mode+".json")).read_text())
              gate=json.loads((root/(mode+".research_gate.json")).read_text())
              q=r["final_geometry_quality"]
              tri=json.loads((root/(mode+".triangles.json")).read_text())
              contact=json.loads((root/(mode+".contact_gate.json")).read_text())
              rows.append({
                "contact_gate":contact["status"],
                "research_contact_screen_pass":contact["finite_zero_thickness_screen_pass"],
                "finite_nonadjacent_seam_related":tri["nonadjacent_seam_related_pair_count"],
                "finite_nonadjacent_other":tri["nonadjacent_other_pair_count"],
                "localized_zone_pairs":tri["localization"]["by_zone_pair"],
                "nonseam_panel_pairs":[p for p in tri["localization"]["by_panel_pair"] if p["category"]=="other"],
                "localized_other_witnesses":tri["localization"]["witnesses"]["other"],
                "mode":mode,"blender":r["blender"],
                "self_collision_enabled":r["self_collision_enabled"],
                "collision_distance_mm":r["collision_assumed_thickness_mm"],
                "solver_seconds":r["solver_elapsed_seconds"],
                "seam_gap_mean_mm":r["final"]["mean_gap_mm"],
                "seam_gap_max_mm":r["final"]["max_gap_mm"],
                "aligned_shape_rms_mm":q["target_shape"]["rigid_aligned_correspondence_rms_mm"],
                "p95_principal_strain":q["strain"]["p95_abs_principal_strain"],
                "reversed_triangles":q["strain"]["orientation_reversed_vs_initial"],
                "weld_topology_pass":r["analytical_stitch_weld_topology"]["research_topological_sphere_screen_pass"],
                "screen_result":gate["status"],
                "failed_checks":[x["metric"] for x in gate["failed_checks"]],
              })
          (root/"collision_comparison.json").write_text(json.dumps({
            "schema":"synthetic-cloth-selfcollision-ab-v1",
            "status":"RESEARCH_ONLY_NO_SELF_INTERSECTION_CERTIFICATION",
            "cases":rows},indent=2))
          print("SELF_COLLISION_AB",json.dumps(rows))
          PY
      - name: Capture exact formatter output for trusted review
        if: always()
        shell: bash
        run: |
          python -m ruff format .
          python - <<'PY'
          import base64
          import pathlib
          import subprocess
          paths = subprocess.check_output(["git","diff","--name-only","-z"]).split(b"\0")
          for raw in paths:
              if not raw:
                  continue
              path = pathlib.Path(raw.decode("utf-8"))
              if path.suffix != ".py":
                  continue
              print("FMT_FILE_BEGIN:" + path.as_posix())
              encoded = base64.b64encode(path.read_bytes()).decode("ascii")
              for offset in range(0, len(encoded), 400):
                  print("FMT_B64:" + encoded[offset:offset + 400])
              print("FMT_FILE_END")
          print("FMT_COMPLETE")
          PY
      - name: Preserve numerical evidence and editable scenes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: synthetic-sample-actual-blender-evidence
          path: ${{ runner.temp }}/collision/
          retention-days: 7
          if-no-files-found: warn
