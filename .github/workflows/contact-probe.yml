name: Temporary owner-only contact localization research
on:
  push:
    branches: [work/cloth-contact-rootcause-20261026]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collision-study:
    # Only a maintainer-reviewed default-branch commit is executable.
    if: github.ref == 'refs/heads/work/cloth-contact-rootcause-20261026' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install geometry tools
        run: 'python -m pip install --only-binary=:all: -r requirements-dev.txt'
      - name: Strict owner-branch quality and full Python suite (temporary YAML removed)
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/contact-probe.yml
          python scripts/check_quality.py
          python -m compileall -q src scripts tests
          python -m pytest -q
      - name: Refuse fake contact pass, corrupt input, and missing evidence
        run: python -m pytest -q tests/test_contact_integrity.py
      - name: Synthesize clean 12-gore + two-cap rest pattern
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/collision"
          python scripts/capped_gore_pattern.py --panels 12 --pole-cut-deg 8 \
            --out "$RUNNER_TEMP/collision/pattern.json"
      - name: Download version-locked Blender 4.3.2
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --connect-timeout 30 \
            https://download.blender.org/release/Blender4.3/blender-4.3.2-linux-x64.tar.xz \
            -o "$RUNNER_TEMP/blender.tar.xz"
          # Pinned digest from the official Blender 4.3.2 SHA256 manifest.
          echo "4da1c956673c0485e63054e563ee69198cc8f80d8157dd7592dffc8a6a5592e6  $RUNNER_TEMP/blender.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/blender.tar.xz" -C "$RUNNER_TEMP"
          B="$RUNNER_TEMP/blender-4.3.2-linux-x64/blender"
          [[ "$("$B" --version)" == *"Blender 4.3.2"* ]]
          echo "BLENDER=$B" >> "$GITHUB_ENV"
      - name: Independent deliberately crossing / separated triangle canaries
        shell: bash
        run: |
          set -euo pipefail
          "$BLENDER" --disable-autoexec --python-exit-code 1 -b -t 1 \
            --python scripts/verify_bvh_intersection_canary.py -- \
            --report "$RUNNER_TEMP/collision/bvh_canary.json"
      - name: Same pattern, zero gravity, collisions OFF / ON
        shell: bash
        run: |
          set -euo pipefail
          for MODE in disabled enabled; do
            EXTRA=()
            if [[ "$MODE" == "enabled" ]]; then EXTRA=(--self-collision); fi
            "$BLENDER" --disable-autoexec --python-exit-code 1 -b -t 2 \
              --python scripts/sewing_capped_poc_blender.py -- \
              --spec "$RUNNER_TEMP/collision/pattern.json" \
              --output "$RUNNER_TEMP/collision/$MODE.blend" \
              --report "$RUNNER_TEMP/collision/$MODE.json" --frames 48 "${EXTRA[@]}"
            python scripts/assess_research_candidate.py \
              --report "$RUNNER_TEMP/collision/$MODE.json" \
              --output "$RUNNER_TEMP/collision/$MODE.research_gate.json"
          done
      - name: Independently reopen two saved .blend snapshots and classify nonadjacent triangle intersections
        shell: bash
        run: |
          set -euo pipefail
          for MODE in disabled enabled; do
            "$BLENDER" --disable-autoexec --python-exit-code 1 -b -t 1 \
              --python scripts/audit_self_intersections_blender.py -- \
              --input "$RUNNER_TEMP/collision/$MODE.blend" \
              --case-report "$RUNNER_TEMP/collision/$MODE.json" \
              --output "$RUNNER_TEMP/collision/$MODE.triangles.json"
          done
      - name: Independent contact veto (execution can succeed but research candidate can fail)
        shell: bash
        run: |
          set -euo pipefail
          for MODE in disabled enabled; do
            python scripts/assess_contact_integrity.py \
              --simulation-report "$RUNNER_TEMP/collision/$MODE.json" \
              --triangle-report "$RUNNER_TEMP/collision/$MODE.triangles.json" \
              --output "$RUNNER_TEMP/collision/$MODE.contact_gate.json"
          done
      - name: Controlled pole-cut study at 6 and 12 degrees (same panel/solver parameters)
        shell: bash
        run: |
          set -euo pipefail
          for ANGLE in 6 12; do
            PREFIX="$RUNNER_TEMP/collision/pole$ANGLE"
            python scripts/capped_gore_pattern.py --panels 12 --pole-cut-deg "$ANGLE" \
              --out "$PREFIX.pattern.json"
            "$BLENDER" --disable-autoexec --python-exit-code 1 -b -t 2 \
              --python scripts/sewing_capped_poc_blender.py -- \
              --spec "$PREFIX.pattern.json" \
              --output "$PREFIX.blend" \
              --report "$PREFIX.json" --frames 48
            python scripts/assess_research_candidate.py \
              --report "$PREFIX.json" --output "$PREFIX.research_gate.json"
            "$BLENDER" --disable-autoexec --python-exit-code 1 -b -t 1 \
              --python scripts/audit_self_intersections_blender.py -- \
              --input "$PREFIX.blend" --case-report "$PREFIX.json" \
              --output "$PREFIX.triangles.json"
            python scripts/assess_contact_integrity.py \
              --simulation-report "$PREFIX.json" \
              --triangle-report "$PREFIX.triangles.json" \
              --output "$PREFIX.contact_gate.json"
          done
      - name: Compare the pole-cut diagnostic and archive unchanged baseline
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          folder = Path(os.environ["RUNNER_TEMP"]) / "collision"
          results = []
          for label, angle in (("disabled", 8), ("pole6", 6), ("pole12", 12)):
              report = json.loads((folder / (label + ".json")).read_text())
              triangles = json.loads((folder / (label + ".triangles.json")).read_text())
              gate = json.loads((folder / (label + ".research_gate.json")).read_text())
              contact = json.loads((folder / (label + ".contact_gate.json")).read_text())
              diagnostic = triangles["localization"]
              groups = diagnostic["by_zone_pair"]
              results.append({
                  "pole_cut_degrees": angle,
                  "panel_count": report["panels"],
                  "self_collision_enabled": report["self_collision_enabled"],
                  "seam_gap_mean_mm": report["final"]["mean_gap_mm"],
                  "target_rms_mm": report["final_geometry_quality"]["target_shape"]["rigid_aligned_correspondence_rms_mm"],
                  "strain_p95": report["final_geometry_quality"]["strain"]["p95_abs_principal_strain"],
                  "geometry_gate": gate["status"],
                  "contact_gate": contact["status"],
                  "seam_related": contact["seam_related_intersections"],
                  "nonseam": contact["other_nonadjacent_intersections"],
                  "nonseam_zone_pairs": [g for g in groups if g["category"] == "other"],
                  "nonseam_witnesses": diagnostic["witnesses"]["other"],
              })
          (folder / "pole_cut_ab.json").write_text(
              json.dumps({"status": "SYNTHETIC_RESEARCH_NOT_APPROVED", "cases": results}, indent=2)
          )
          print("POLE_CUT_AB", json.dumps([{k: v for k, v in item.items() if k != "nonseam_witnesses"} for item in results]))
          PY
      - name: Controlled 1mm and 5mm reference-offset trials (same 8-degree cap)
        shell: bash
        run: |
          set -euo pipefail
          for MM in 1 5; do
            PREFIX="$RUNNER_TEMP/collision/offset$MM"
            "$BLENDER" --disable-autoexec --python-exit-code 1 -b -t 2 \
              --python scripts/sewing_capped_poc_blender.py -- \
              --spec "$RUNNER_TEMP/collision/pattern.json" \
              --output "$PREFIX.blend" --report "$PREFIX.json" \
              --frames 48 --preposition-offset-mm "$MM"
            python scripts/assess_research_candidate.py \
              --report "$PREFIX.json" --output "$PREFIX.research_gate.json"
            "$BLENDER" --disable-autoexec --python-exit-code 1 -b -t 1 \
              --python scripts/audit_self_intersections_blender.py -- \
              --input "$PREFIX.blend" --case-report "$PREFIX.json" \
              --output "$PREFIX.triangles.json"
            python scripts/assess_contact_integrity.py \
              --simulation-report "$PREFIX.json" \
              --triangle-report "$PREFIX.triangles.json" \
              --output "$PREFIX.contact_gate.json"
          done
      - name: Compare reference-offset research without relaxing contact veto
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          folder = Path(os.environ["RUNNER_TEMP"]) / "collision"
          results = []
          for label, offset in (("offset1", 1), ("disabled", 3), ("offset5", 5)):
              trial = json.loads((folder / (label + ".json")).read_text())
              contact = json.loads((folder / (label + ".contact_gate.json")).read_text())
              gate = json.loads((folder / (label + ".research_gate.json")).read_text())
              localization = json.loads((folder / (label + ".triangles.json")).read_text())["localization"]
              results.append({
                  "preposition_offset_mm": offset,
                  "seam_gap_mean_mm": trial["final"]["mean_gap_mm"],
                  "target_rms_mm": trial["final_geometry_quality"]["target_shape"]["rigid_aligned_correspondence_rms_mm"],
                  "principal_strain_p95": trial["final_geometry_quality"]["strain"]["p95_abs_principal_strain"],
                  "geometry_gate": gate["status"],
                  "contact_gate": contact["status"],
                  "nonseam": contact["other_nonadjacent_intersections"],
                  "seam_related": contact["seam_related_intersections"],
                  "nonseam_zone_counts": [z for z in localization["by_zone_pair"] if z["category"] == "other"],
              })
          (folder / "offset_ab.json").write_text(json.dumps({
              "status": "SYNTHETIC_RESEARCH_NOT_APPROVED", "cases": results
          }, indent=2))
          print("OFFSET_AB", json.dumps(results))
          PY
      - name: Controlled outward-surface-normal versus horizontal radial placement
        shell: bash
        run: |
          set -euo pipefail
          for MM in 1 3; do
            PREFIX="$RUNNER_TEMP/collision/normal$MM"
            "$BLENDER" --disable-autoexec --python-exit-code 1 -b -t 2 \
              --python scripts/sewing_capped_poc_blender.py -- \
              --spec "$RUNNER_TEMP/collision/pattern.json" \
              --output "$PREFIX.blend" --report "$PREFIX.json" \
              --frames 48 --preposition-offset-mm "$MM" \
              --preposition-direction normal
            python scripts/assess_research_candidate.py \
              --report "$PREFIX.json" --output "$PREFIX.research_gate.json"
            "$BLENDER" --disable-autoexec --python-exit-code 1 -b -t 1 \
              --python scripts/audit_self_intersections_blender.py -- \
              --input "$PREFIX.blend" --case-report "$PREFIX.json" \
              --output "$PREFIX.triangles.json"
            python scripts/assess_contact_integrity.py \
              --simulation-report "$PREFIX.json" \
              --triangle-report "$PREFIX.triangles.json" \
              --output "$PREFIX.contact_gate.json"
          done
      - name: Compare cap-junction contact under radial and ellipsoid-normal placement
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          folder = Path(os.environ["RUNNER_TEMP"]) / "collision"
          rows = []
          for label, offset, direction in (
              ("offset1", 1, "radial"), ("disabled", 3, "radial"),
              ("normal1", 1, "normal"), ("normal3", 3, "normal"),
          ):
              trial = json.loads((folder / (label + ".json")).read_text())
              contact = json.loads((folder / (label + ".contact_gate.json")).read_text())
              gate = json.loads((folder / (label + ".research_gate.json")).read_text())
              tri = json.loads((folder / (label + ".triangles.json")).read_text())
              assert trial["preposition_direction"] == direction
              rows.append({
                  "offset_mm": offset, "direction": direction,
                  "seam_gap_mean_mm": trial["final"]["mean_gap_mm"],
                  "rms_mm": trial["final_geometry_quality"]["target_shape"]["rigid_aligned_correspondence_rms_mm"],
                  "strain_p95": trial["final_geometry_quality"]["strain"]["p95_abs_principal_strain"],
                  "nonseam": contact["other_nonadjacent_intersections"],
                  "seam_related": contact["seam_related_intersections"],
                  "geometry_gate": gate["status"], "contact_gate": contact["status"],
                  "nonseam_zone_counts": [x for x in tri["localization"]["by_zone_pair"] if x["category"] == "other"],
              })
          (folder / "normal_vs_radial.json").write_text(json.dumps(
              {"status": "SYNTHETIC_RESEARCH_NOT_APPROVED", "cases": rows}, indent=2
          ))
          print("NORMAL_VS_RADIAL", json.dumps(rows))
          PY
      - name: Write directly comparable parameter/quality report
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,pathlib
          root=pathlib.Path(os.environ["RUNNER_TEMP"])/"collision"
          rows=[]
          for mode in ("disabled","enabled"):
              r=json.loads((root/(mode+".json")).read_text())
              gate=json.loads((root/(mode+".research_gate.json")).read_text())
              q=r["final_geometry_quality"]
              tri=json.loads((root/(mode+".triangles.json")).read_text())
              contact=json.loads((root/(mode+".contact_gate.json")).read_text())
              rows.append({
                "contact_gate":contact["status"],
                "research_contact_screen_pass":contact["finite_zero_thickness_screen_pass"],
                "finite_nonadjacent_seam_related":tri["nonadjacent_seam_related_pair_count"],
                "finite_nonadjacent_other":tri["nonadjacent_other_pair_count"],
                "localization_zone_counts":tri["localization"]["by_zone_pair"],
                "localization_panel_pairs_top":tri["localization"]["by_panel_pair"][:20],
                "nonseam_position_witnesses":tri["localization"]["witnesses"]["other"],
                "mode":mode,"blender":r["blender"],
                "self_collision_enabled":r["self_collision_enabled"],
                "collision_distance_mm":r["collision_assumed_thickness_mm"],
                "solver_seconds":r["solver_elapsed_seconds"],
                "seam_gap_mean_mm":r["final"]["mean_gap_mm"],
                "seam_gap_max_mm":r["final"]["max_gap_mm"],
                "aligned_shape_rms_mm":q["target_shape"]["rigid_aligned_correspondence_rms_mm"],
                "p95_principal_strain":q["strain"]["p95_abs_principal_strain"],
                "reversed_triangles":q["strain"]["orientation_reversed_vs_initial"],
                "weld_topology_pass":r["analytical_stitch_weld_topology"]["research_topological_sphere_screen_pass"],
                "screen_result":gate["status"],
                "failed_checks":[x["metric"] for x in gate["failed_checks"]],
              })
          (root/"collision_comparison.json").write_text(json.dumps({
            "schema":"synthetic-cloth-selfcollision-ab-v1",
            "status":"RESEARCH_ONLY_NO_SELF_INTERSECTION_CERTIFICATION",
            "cases":rows},indent=2))
          print("SELF_COLLISION_AB",json.dumps(rows))
          PY
      - name: Preserve numerical evidence and editable scenes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: capped-synthetic-contact-localization
          path: ${{ runner.temp }}/collision/
          retention-days: 7
          if-no-files-found: warn

      - name: Emit deterministic formatter repair for owner branch
        if: always()
        shell: bash
        run: |
          python -m ruff format .
          python - <<'PY'
          import base64
          import pathlib
          import subprocess

          paths = subprocess.check_output(["git", "diff", "--name-only", "-z"]).split(b"\0")
          for raw in paths:
              if not raw:
                  continue
              path = pathlib.Path(raw.decode("utf-8"))
              if path.suffix != ".py":
                  continue
              print("FMT_FILE_BEGIN:" + path.as_posix())
              encoded = base64.b64encode(path.read_bytes()).decode("ascii")
              for offset in range(0, len(encoded), 400):
                  print("FMT_B64:" + encoded[offset:offset + 400])
              print("FMT_FILE_END")
          print("FMT_COMPLETE")
          PY
