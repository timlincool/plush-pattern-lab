name: Stage6 B24 R1 native Blender Cloth (trusted main)
# Reviewed main only; no pull_request code or automatic execution of external .blend files.
on:
  push:
    branches: [main]
    paths:
      - 'research/stage6_b24_r1/**'
      - '.github/workflows/stage6-b24-r1-physical.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: stage6-b24-r1-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-physical-test:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
      GH_TOKEN: ${{ github.token }}
      B24_ROOT: ${{ runner.temp }}/b24-r1
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Pinned Python libraries and trimesh geometry writer
        run: python -m pip install --only-binary=:all: -r requirements-dev.txt 'trimesh>=4,<5'
      - name: Restore exact signed-off previous Blender B24 source run
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$B24_ROOT/original" "$B24_ROOT/r1" "$B24_ROOT/solver"
          gh run download 43558523018 -R "$GITHUB_REPOSITORY" -n stage6-hoof-3d-arc-and-2d-projection-reference -D "$B24_ROOT/original"
          echo "e7b890a3dae087df7e1c0d92c05716adcfd098279e5a067519de6a844f31fd8a  $B24_ROOT/original/stage6_b24_cloth_preview/actual_evaluated_B24_Cloth_frame.npz" | sha256sum -c -
          echo "eebda049ac34ee201a3251b363a915fa05ad6417394bc565bb4cc7942b4545ae  $B24_ROOT/original/split_volume_toile_AB_research/two_volume_source_envelope_ab.json" | sha256sum -c -
          echo "1427c7bdfc376431378e516f90540cb56e3b9adfb4695a3d5858c584041eea59  $B24_ROOT/original/lower_mother_toile_research/lower_toile_source_geometry.json" | sha256sum -c -
          echo "2eda037eb54ef810e71affa55ad8fd7e5d9d189b51b8c1b8d4d73c77bf2266d3  $B24_ROOT/original/split_volume_toile_AB_research/B_integrated_neck_port/panel_interface_research_graph.json" | sha256sum -c -
          echo "071acfced61e6bbf52584dc3a68c54bb72d838e87b7c87fe6a1e46181efe2b46  $B24_ROOT/original/true_stage6_source_section_summary.json" | sha256sum -c -
      - name: Recompute R1 actual flat 2D panels and 3D preposition
        shell: bash
        run: |
          set -euo pipefail
          python research/stage6_b24_r1/design_b24_r1_source_informed.py \
            --upper "$B24_ROOT/original/split_volume_toile_AB_research/two_volume_source_envelope_ab.json" \
            --lower "$B24_ROOT/original/lower_mother_toile_research/lower_toile_source_geometry.json" \
            --graph "$B24_ROOT/original/split_volume_toile_AB_research/B_integrated_neck_port/panel_interface_research_graph.json" \
            --sections "$B24_ROOT/original/true_stage6_source_section_summary.json" \
            --output "$B24_ROOT/r1"
          python research/stage6_b24_r1/build_b24_r1_blender_staging.py \
            --snapshot "$B24_ROOT/original/stage6_b24_cloth_preview/actual_evaluated_B24_Cloth_frame.npz" \
            --upper "$B24_ROOT/r1/B24_R1_upper_source_envelope_ab_RESEARCH_ONLY.json" \
            --out "$B24_ROOT/r1"
          echo "676541542f67d0da71c4549068b736507fd177e948281fc39908e7cee5bcd2d4  $B24_ROOT/r1/B24_R1_NEW_2D_REST_NEW_3D_PREPOSITION_NOT_SOLVED.npz" | sha256sum -c -
      - name: Download official Blender 4.3.2 with exact verified SHA
        shell: bash
        run: |
          set -euo pipefail
          obtained=0
          for base in \
            https://download.blender.org/release/Blender4.3 \
            https://mirror.blender.org/release/Blender4.3 \
            https://mirrors.ocf.berkeley.edu/blender/release/Blender4.3; do
            if curl -fL --retry 2 --connect-timeout 30 --max-time 360 \
              "$base/blender-4.3.2-linux-x64.tar.xz" -o "$RUNNER_TEMP/blender.tar.xz" \
              && echo "4da1c956673c0485e63054e563ee69198cc8f80d8157dd7592dffc8a6a5592e6  $RUNNER_TEMP/blender.tar.xz" | sha256sum -c -; then
              obtained=1
              break
            fi
          done
          test "$obtained" -eq 1
          tar -xJf "$RUNNER_TEMP/blender.tar.xz" -C "$RUNNER_TEMP"
          BLENDER="$RUNNER_TEMP/blender-4.3.2-linux-x64/blender"
          [[ "$("$BLENDER" --version)" == *"Blender 4.3.2"* ]]
          echo "BLENDER=$BLENDER" >> "$GITHUB_ENV"
      - name: Genuine native Cloth 40-frame R1 evaluation
        shell: bash
        run: |
          set -euo pipefail
          "$BLENDER" --disable-autoexec --python-exit-code 1 -b -t 1 \
            --python research/stage6_b24_r1/run_B24_R1_native_Blender_Cloth_4_3_2.py -- \
            --input "$B24_ROOT/r1/B24_R1_NEW_2D_REST_NEW_3D_PREPOSITION_NOT_SOLVED.npz" \
            --qa "$B24_ROOT/r1/B24_R1_staging_QA.json" \
            --out "$B24_ROOT/solver" --frames 40
      - name: Independently verify evaluated vertices and export GLB
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          import numpy as np
          import trimesh

          root = Path(os.environ["B24_ROOT"]) / "solver"
          report_path = root / "B24_R1_native_blender_report.json"
          report = json.loads(report_path.read_text())
          with np.load(root / "B24_R1_actual_evaluated_Cloth_frame40.npz") as snap:
              actual = snap["evaluated_blender_cloth_vertices_m"]
              initial = snap["initial_3d_prepositioned_vertices_m"]
              pairs = snap["original_sewing_spring_vertex_pairs"]
              lengths = snap["face_lengths"]
              ids = snap["face_vertex_ids"]
          assert actual.shape == initial.shape == (2431, 3)
          assert pairs.shape == (974, 2)
          assert np.isfinite(actual).all() and not np.array_equal(actual, initial)
          gap = np.linalg.norm(actual[pairs[:, 0]] - actual[pairs[:, 1]], axis=1) * 1000
          assert abs(report["final_seam_gap_mean_mm"] - float(gap.mean())) < 1e-6
          assert gap.mean() < report["initial_seam_gap_mean_mm"]
          triangles = []
          at = 0
          for length in lengths:
              polygon = ids[at:at + int(length)]
              triangles.extend(
                  (int(polygon[0]), int(polygon[k]), int(polygon[k + 1]))
                  for k in range(1, int(length) - 1)
              )
              at += int(length)
          mesh = trimesh.Trimesh(
              vertices=actual, faces=np.asarray(triangles), process=False
          )
          mesh.export(root / "B24_R1_native_Cloth_TRUE_FRAME40.glb")
          report["independent_3d_export_from_real_solver"] = True
          report["real_triangulated_faces"] = len(triangles)
          report["old_B24_seam_gap_mean_mm"] = 0.007379937373069842
          report["appearance_and_collision_gate"] = "NOT_YET_CHECKED_REJECT_PRODUCTION"
          report_path.write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + "\n"
          )
          print("R1_REAL_EVALUATED_GLB_COMPLETE", report)
          PY
      - name: Upload genuine solver evidence or partial failure report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: stage6-b24-r1-true-native-blender-solver-evidence
          path: |
            ${{ runner.temp }}/b24-r1/r1/*.json
            ${{ runner.temp }}/b24-r1/r1/*.npz
            ${{ runner.temp }}/b24-r1/solver/*.json
            ${{ runner.temp }}/b24-r1/solver/*.npz
            ${{ runner.temp }}/b24-r1/solver/*.blend
            ${{ runner.temp }}/b24-r1/solver/*.glb
          if-no-files-found: warn
          retention-days: 7
