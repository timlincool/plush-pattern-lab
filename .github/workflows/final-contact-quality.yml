name: Temporary owner-only final research quality check
on:
  push:
    branches: [work/cloth-contact-rootcause-20261026]
permissions:
  contents: read
jobs:
  final-quality:
    if: github.event_name == 'push' && github.ref == 'refs/heads/work/cloth-contact-rootcause-20261026'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install trusted wheel-only test dependencies
        run: 'python -m pip install --only-binary=:all: -r requirements-dev.txt'
      - name: Install local trusted package
        run: python -m pip install --no-deps --no-build-isolation -e .
      - name: Verify exact final four-workflow tree and research provenance
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/final-contact-quality.yml
          python scripts/check_quality.py
          python -m compileall -q src scripts tests
          python -m pytest -q
          python -m pip wheel --no-deps --no-build-isolation --wheel-dir "$RUNNER_TEMP/wheel" .
      - name: Export formatter-only review patch
        if: always()
        shell: bash
        run: |
          python -m ruff format .
          python - <<'PY'
          import base64
          import pathlib
          import subprocess
          paths = subprocess.check_output(["git", "diff", "--name-only", "-z"]).split(b"\0")
          for raw in paths:
              if not raw:
                  continue
              path = pathlib.Path(raw.decode("utf-8"))
              if path.suffix != ".py":
                  continue
              print("FMT_FILE_BEGIN:" + path.as_posix())
              encoded = base64.b64encode(path.read_bytes()).decode("ascii")
              for i in range(0, len(encoded), 400):
                  print("FMT_B64:" + encoded[i:i+400])
              print("FMT_FILE_END")
          print("FMT_COMPLETE")
          PY
