name: Stage6 isolated FreeCAD flatmesh vs ABF research
# Deliberately does not run untrusted PR code and does not alter Stage6 production.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/stage6-freecad-flatmesh.yml'
      - 'scripts/run_stage6_freecad_flatmesh.py'
      - 'scripts/compare_stage6_freecad_flatmesh.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: stage6-freecad-independent-${{ github.ref }}
  cancel-in-progress: true
jobs:
  isolated-freecad:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Retrieve existing trusted real Stage6 12-disk inputs, not Blender
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/stage6-fc-source"
          gh run download 43359212094 \
            --repo timlincool/plush-pattern-lab \
            --name stage6-hoof-3d-arc-and-2d-projection-reference \
            --dir "$RUNNER_TEMP/stage6-fc-source"
          cd "$RUNNER_TEMP/stage6-fc-source"
          echo "292be7e50f7c3b20bbcd03c8bccc86d501fc71c2ccb45fa737299f1c39134027  true_stage6_ear_root_slit_lscm_research.json" | sha256sum -c -
          echo "c841bff599c5eabeb8ba5928d4ae414ff61c76f59909e3c36d7902e481a2cf6b  stage6_free_blender_uv_raw.json" | sha256sum -c -
          echo "6ced983f402d32a1aa63b509d4f01ec477ea37ae36728a936faf336805cbb6f8  stage6_free_blender_uv_vs_lscm.json" | sha256sum -c -
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b
        with:
          enable_kvm: false
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Resolve precisely pinned open-source FreeCAD environment
        shell: bash
        run: |
          set -euo pipefail
          target="$RUNNER_TEMP/pinned-freecad-addon"
          mkdir -p "$target"
          git -C "$target" init -q
          git -C "$target" remote add origin https://github.com/goatchurchprime/blender-seams-to-sewing-pattern.git
          git -C "$target" fetch -q --depth 1 origin 0ea2585105a13e03cf017cca53da684b31eb97df
          git -C "$target" checkout -q --detach FETCH_HEAD
          test "$(git -C "$target" rev-parse HEAD)" = "0ea2585105a13e03cf017cca53da684b31eb97df"
          grep -q 'flatmesh.FaceUnwrapper' "$target/op_freecad_flatten_component.py"
          test -f "$target/magic-blender/flake.lock"
          test -f "$target/GPL-license.txt"
      - name: Execute compiled FreeCAD FaceUnwrapper on twelve real source disks
        shell: bash
        run: |
          set -euo pipefail
          base="$RUNNER_TEMP/stage6-fc-source"
          mkdir -p "$RUNNER_TEMP/stage6-fc-output"
          nix develop "$RUNNER_TEMP/pinned-freecad-addon/magic-blender" --command \
            blender --background --factory-startup --disable-autoexec \
              --python-exit-code 1 --python scripts/run_stage6_freecad_flatmesh.py -- \
              --source "$base/true_stage6_ear_root_slit_lscm_research.json" \
              --output "$RUNNER_TEMP/stage6-fc-output/flatmesh_12_real_disks.json"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Score same original triangles and source seams with existing QA
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --only-binary=:all: -r requirements-dev.txt
          python -m pip install --no-deps --no-build-isolation -e .
          base="$RUNNER_TEMP/stage6-fc-source"
          python scripts/compare_stage6_freecad_flatmesh.py \
            --source "$base/true_stage6_ear_root_slit_lscm_research.json" \
            --native "$base/stage6_free_blender_uv_raw.json" \
            --audit "$base/stage6_free_blender_uv_vs_lscm.json" \
            --freecad "$RUNNER_TEMP/stage6-fc-output/flatmesh_12_real_disks.json" \
            --output "$RUNNER_TEMP/stage6-fc-output/freecad_vs_abf_same_source.json"
          python - <<'PY'
          import json, os, pathlib
          p = pathlib.Path(os.environ["RUNNER_TEMP"])/"stage6-fc-output/freecad_vs_abf_same_source.json"
          result = json.loads(p.read_text(encoding="utf8"))
          assert result["count"] == 12
          assert result["same_original_source_faces_and_cut_edges_for_every_pair"]
          assert result["factory_cutting_patterns_approved"] == 0
          assert result["P3_status"] == "in_progress" and result["P4_status"] == "not_started"
          print("STAGE6_FREECAD_REAL_SOURCE_ABF_COMPARISON_COMPLETED_RESEARCH_ONLY")
          PY
      - name: Preserve isolated research records, even when FreeCAD is unavailable
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: stage6-freecad-flatmesh-isolated-research
          path: ${{ runner.temp }}/stage6-fc-output/**
          if-no-files-found: warn
          retention-days: 7
